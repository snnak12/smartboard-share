<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahtaya Dosya Yükle</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background: #f8f9fa; }
    .card { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
    input[type="file"] { margin: 20px 0; display: block; width: 100%; padding: 10px; border: 1px dashed #ccc; border-radius: 6px; }
    button { width: 100%; padding: 14px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Akıllı Tahtaya Gönder</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" required>
      <button type="submit">Gönder 🚀</button>
    </form>
    <p id="status"></p>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      status.style.color = '#333';
      status.innerText = 'Yükleniyor...';

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        if (res.ok) {
          status.style.color = 'green';
          status.innerText = '✅ Dosya akıllı tahtaya başarıyla aktarıldı!';
          fileInput.value = '';
        } else {
          status.style.color = 'red';
          status.innerText = '❌ Yükleme sırasında bir hata oluştu.';
        }
      } catch (err) {
        status.style.color = 'red';
        status.innerText = '❌ Sunucuya bağlanılamadı.';
      }
    });
  </script>
</body>
</html>
